<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>404 — HoneyCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#FDF8F2;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
.wrap{max-width:480px;}
.code{font-size:96px;font-weight:800;color:#E7EAF0;line-height:1;margin-bottom:8px;}
h1{font-size:28px;font-weight:800;color:#19253D;margin-bottom:12px;}
p{color:#4B5565;font-size:16px;line-height:1.6;margin-bottom:32px;}
.emoji{font-size:80px;margin-bottom:16px;display:block;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
a{display:inline-flex;align-items:center;gap:8px;background:#C1502E;color:#fff;font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px;text-decoration:none;border:2.5px solid #A23F22;box-shadow:4px 5px 0 0 #A23F22;transition:transform .12s,box-shadow .12s;}
a:hover{transform:translate(-2px,-2px);box-shadow:6px 7px 0 0 #A23F22;}
</style>
</head>
<body>
<div class="wrap">
  <span class="emoji">🐾</span>
  <div class="code">404</div>
  <h1>¡Honey se perdió!</h1>
  <p>Esta página no existe... pero hay muchísimas lecciones esperándote.</p>
  <a href="/">🏠 Volver al inicio</a>
</div>
</body>
</html>
